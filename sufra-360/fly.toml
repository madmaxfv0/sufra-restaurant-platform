# SUFRA 360 on Fly.io. App names are global - if this one is taken, change it
# here and pass the same name to deploy/deploy_fly.sh.
app = "sufra-360"
primary_region = "fra"

[http_service]
  internal_port = 8013
  force_https = true
  # one always-on machine: the live-update hub is held in this process
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
