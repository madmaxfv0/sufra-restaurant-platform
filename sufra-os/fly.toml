# SUFRA OS on Fly.io. App names are global - if this one is taken, change it
# here and pass the same name to deploy_fly.sh.
app = "sufra-os"
primary_region = "fra"

[env]
  SUFRA_TZ = "Asia/Baku"
  # demo switches stay off in production: no simulated service, no reseed, no reset
  NOVA_SIMULATE = "0"

[mounts]
  source = "sufra_os_data"
  destination = "/data"

[http_service]
  internal_port = 8123
  force_https = true
  # The reservation scheduler (late / no-show / reminders) runs inside this
  # process, so the machine must never be put to sleep.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/build"
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
