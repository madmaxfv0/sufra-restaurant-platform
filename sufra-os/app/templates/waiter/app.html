<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0A1020">
  <title>SUFRA · Waiter</title>
  <link rel="stylesheet" href="/static/css/nova.css?v=20260911-menu-sections1">
  <link rel="stylesheet" href="/static/css/sufra-upgrade.css?v=20260901-sufra-pro1">
  <link rel="stylesheet" href="/static/css/enterprise.css?v=20260902-ent1">
<link rel="stylesheet" href="/static/css/sufra-repair-v2.css?v=20260902-repair2">
<link rel="stylesheet" href="/static/css/sufra-polish-v3.css?v=20260902-v3">
<link rel="stylesheet" href="/static/css/sufra-polish-v4.css?v=20260902-v4">
<link rel="stylesheet" href="/static/css/sufra-v5.css?v=20260902-v5">
<link rel="icon" href="/static/img/sufra-logo.png">
<link rel="stylesheet" href="/static/css/sufra-final-responsive.css?v=20260911-final1">
<link rel="stylesheet" href="/static/css/staff-access.css?v=20260914-four1">
</head>
<body class="app-waiter" data-nova-build="20260831-working-1">

<!-- Staff access screen: profile cards, then a PIN pad. Rendered by
     NOVA.auth.staffLogin() so the admin app can share the exact same door. -->
<section class="signin" id="auth-mount">
  <div class="signin-box"><div class="auth-head">
    <div class="wordmark big">SU<span>FRA</span></div>
    <h1>Opening waiter access…</h1><p>Loading your team.</p>
  </div></div>
</section>

<div class="w-shell" id="w-shell" hidden>
  <header class="w-top">
    <div>
      <b id="w-greeting">Good evening</b>
      <span id="w-sub">—</span>
    </div>
    <button class="bell" id="bell" aria-label="Notifications" style="position:static;width:36px;height:36px"></button>
  </header>

  <main class="w-body" id="w-body">
    <!-- HOME / TABLES / ORDER / TASKS / PROFILE each render here -->
  </main>

  <nav class="w-nav">
    <button class="on" data-tab="home"><i class="wi wi-home"></i><span>Home</span></button>
    <button data-tab="tables"><i class="wi wi-tables"></i><span>Tables</span><em id="c-tables"></em></button>
    <button class="w-nav-order" data-tab="order"><i class="wi wi-order"></i><span>Order</span></button>
    <button data-tab="tasks"><i class="wi wi-tasks"></i><span>Tasks</span><em id="c-tasks"></em></button>
    <button data-tab="profile"><i class="wi wi-profile"></i><span>Profile</span></button>
  </nav>
</div>

<!-- Legacy lock mount; inactivity now ends the session and returns to sign-in. -->
<section class="lock-overlay" id="lock-overlay" hidden></section>

<aside class="sheet" id="sheet"></aside>
<aside class="inspector" id="notifications"></aside>
<div class="modal-backdrop" id="modal"></div>

<script>window.NOVA_STAFF_ROSTER = {{ staff_roster|tojson }};</script>
<script>window.SUFRA_CURRENCY = {{ (currency or "\u20bc")|tojson }};</script>
<script src="/static/js/nova-core.js?v=20260915-audit1"></script>
<script src="/static/js/vendor/jsQR.js?v=1.4.0"></script>
<script src="/static/js/staff-qr.js?v=20260915-qr-recovery1"></script>
<script src="/static/js/waiter.js?v=20260914-qr1"></script>
<script src="/static/js/enterprise.js?v=20260915-qr-recovery1"></script>
<script>bootWaiter();</script>
<script src="/static/js/sufra-upgrade.js?v=20260901-sufra-pro1"></script>
<script src="/static/js/sufra-polish-v3.js?v=20260914-four1"></script>
<script src="/static/js/sufra-polish-v4.js?v=20260902-v4"></script>
<script src="/static/js/sufra-v5.js?v=20260914-four1"></script>
<script src="/static/js/sufra-translations.js?v=20260915-audit1"></script>
<script src="/static/js/sufra-final-i18n.js?v=20260915-audit1"></script>
</body>
</html>
