# The database and every uploaded file live here, not in the image.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sufra-os-data
  namespace: sufra
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  # storageClassName: <your class>   # omit to use the cluster default
