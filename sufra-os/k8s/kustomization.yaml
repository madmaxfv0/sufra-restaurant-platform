apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sufra
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: REGISTRY/sufra-os
    newName: REGISTRY/sufra-os      # e.g. ghcr.io/<you>/sufra-os
    newTag: latest
